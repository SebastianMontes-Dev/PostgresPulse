# ============================================================
# PostgresPulse - Entorno completo (Fase 7)
# Levanta: pulse-db (almacenamiento propio), target-demo
# (base de datos demo con datos de ventas mal modelados a proposito)
# y app (la aplicacion, construida desde el Dockerfile).
#
# Uso: docker compose up -d
# Variables de entorno: se leen de .env (ver .env.example) si existe;
# si no, se usan los valores de desarrollo por defecto de abajo.
#
# Stack de monitoreo opcional (Prometheus + Grafana, docs/DEPLOYMENT.md
# #5.6), fuera del "arranque en 3 comandos" por defecto:
#   ./scripts/generar-token-monitoreo.sh   # o .ps1 en Windows
#   docker compose --profile monitoring up -d
# ============================================================

services:
  pulse-db:
    image: postgres:16-alpine
    container_name: pulse-db
    environment:
      POSTGRES_DB: pulse_db
      POSTGRES_USER: pulse
      POSTGRES_PASSWORD: pulse
    ports:
      - "5432:5432"
    volumes:
      - pulse_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulse -d pulse_db"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  target-demo:
    image: postgres:16-alpine
    container_name: pulse-target-demo
    environment:
      POSTGRES_DB: ventas_db
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
    ports:
      - "5433:5432"
    volumes:
      # Solo scripts/db-init/ (no scripts/ completo): el entrypoint de
      # postgres ejecuta cualquier .sh que encuentre en este directorio, y
      # scripts/ tambien contiene demo.ps1/demo.sh (docs/SPECS.md #14, demo
      # E2E), que no son scripts de inicializacion de esta base de datos.
      - ./scripts/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d ventas_db"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pulse-app
    environment:
      PULSE_LOG_FORMAT: ecs
      PULSE_DB_URL: jdbc:postgresql://pulse-db:5432/pulse_db
      PULSE_DB_USER: pulse
      PULSE_DB_PASSWORD: pulse
      PULSE_CRYPTO_KEY: ${PULSE_CRYPTO_KEY:-clave-de-desarrollo-por-defecto-32-caracteres!}
      PULSE_SCHEDULER_ENABLED: ${PULSE_SCHEDULER_ENABLED:-false}
      PULSE_SCHEDULER_CRON: ${PULSE_SCHEDULER_CRON:-0 0 * * * *}
      PULSE_ADMIN_USER: ${PULSE_ADMIN_USER:-admin}
      PULSE_ADMIN_PASSWORD: ${PULSE_ADMIN_PASSWORD:-admin}
      PULSE_JWT_SECRET: ${PULSE_JWT_SECRET:-secreto-jwt-de-desarrollo-por-defecto!}
      PULSE_DEMO_SEED: ${PULSE_DEMO_SEED:-true}
    ports:
      - "8080:8080"
    depends_on:
      pulse-db:
        condition: service_healthy
      target-demo:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: "1.0"

  # Stack de monitoreo opcional -- no arranca con "docker compose up" solo
  # (docs/DEPLOYMENT.md #5.6): requiere --profile monitoring.
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: pulse-prometheus
    profiles: ["monitoring"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus_token.txt:/etc/prometheus/postgrespulse.token:ro
    ports:
      - "9090:9090"
    depends_on:
      - app
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.4.2
    container_name: pulse-grafana
    profiles: ["monitoring"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  pulse_data:
