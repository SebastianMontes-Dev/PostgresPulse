name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build y pruebas (Maven + Testcontainers)
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verificar (compilar + pruebas unitarias e integracion con Testcontainers + cobertura)
        run: ./mvnw -B verify

      - name: Publicar reportes de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7

      - name: Publicar reporte de cobertura (JaCoCo)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          retention-days: 7

      - name: Publicar reporte de analisis estatico (SpotBugs, no bloqueante)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spotbugs-report
          path: target/spotbugsXml.xml
          retention-days: 7
          if-no-files-found: ignore

  docker:
    name: Construir, escanear y publicar imagen Docker
    needs: build
    if: >
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Normalizar nombre de imagen (GHCR exige minusculas)
        run: echo "IMAGEN=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Calcular tags de la imagen (latest + sha; version semver en push de tag vX.Y.Z)
        run: |
          IMAGE_TAGS=("${IMAGEN}:latest" "${IMAGEN}:${{ github.sha }}")
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"
            MINOR="${VERSION%.*}"
            IMAGE_TAGS+=("${IMAGEN}:${VERSION}" "${IMAGEN}:${MINOR}")
          fi
          {
            echo "TAGS<<TAGS_EOF"
            printf '%s\n' "${IMAGE_TAGS[@]}"
            echo "TAGS_EOF"
          } >> "$GITHUB_ENV"

      - name: Construir imagen (sin publicar todavia)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.TAGS }}

      - name: Escanear vulnerabilidades con Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGEN }}:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

      - name: Iniciar sesion en GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar imagen (ya escaneada; reutiliza la cache de la construccion anterior)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.TAGS }}
