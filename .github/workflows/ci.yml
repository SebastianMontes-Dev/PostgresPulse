name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backup-restore:
    name: Verificar respaldo y restauracion (scripts/respaldar.sh)
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v7

      - name: Levantar pulse-db
        run: |
          docker run -d --name pulse-db \
            -e POSTGRES_DB=pulse_db -e POSTGRES_USER=pulse -e POSTGRES_PASSWORD=pulse \
            postgres:16-alpine
          # La imagen oficial de postgres arranca un servidor temporal para
          # initdb (acepta conexiones brevemente y se apaga) antes de levantar
          # el servidor real -- un pg_isready ingenuo puede enganchar esa
          # ventana falsa. Se espera a que el mensaje de listo aparezca DOS
          # veces en los logs (temporal + real) antes de seguir.
          for i in $(seq 1 60); do
            listo="$(docker logs pulse-db 2>&1 | grep -c 'database system is ready to accept connections' || true)"
            [ "$listo" -ge 2 ] && break
            sleep 1
          done
          docker exec pulse-db pg_isready -U pulse -d pulse_db

      - name: Sembrar un dato de verificacion
        run: |
          docker exec pulse-db psql -U pulse -d pulse_db -c \
            "CREATE TABLE verificacion_respaldo(marca TEXT); INSERT INTO verificacion_respaldo VALUES ('run-${{ github.run_id }}');"

      - name: Respaldar
        run: |
          chmod +x scripts/respaldar.sh
          ./scripts/respaldar.sh backup

      - name: Simular perdida de datos
        run: docker exec pulse-db psql -U pulse -d pulse_db -c "DROP TABLE verificacion_respaldo;"

      - name: Restaurar desde el respaldo
        run: |
          archivo="$(ls -t backups/*.sql | head -1)"
          echo "restaurar" | ./scripts/respaldar.sh restaurar "$archivo"

      - name: Verificar que el dato volvio intacto
        run: |
          valor="$(docker exec pulse-db psql -U pulse -d pulse_db -tAc "SELECT marca FROM verificacion_respaldo;")"
          echo "Valor restaurado: $valor"
          [ "$valor" = "run-${{ github.run_id }}" ] || { echo "El respaldo/restauracion no preservo el dato" >&2; exit 1; }

  build:
    name: Build y pruebas (Maven + Testcontainers)
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v7

      - name: Configurar JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verificar (compilar + pruebas unitarias e integracion con Testcontainers + cobertura)
        run: ./mvnw -B verify

      - name: Publicar reportes de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7

      - name: Publicar reporte de cobertura (JaCoCo)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          retention-days: 7

      - name: Publicar reporte de analisis estatico (SpotBugs, no bloqueante)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spotbugs-report
          path: target/spotbugsXml.xml
          retention-days: 7
          if-no-files-found: ignore

  docker:
    name: Construir, escanear y publicar imagen Docker
    needs: build
    # Se construye y escanea con Trivy en cada PR (gate de seguridad temprano);
    # publicar a GHCR solo ocurre en push a main o en tags v*, ver el "if" de
    # los pasos de login/publicacion mas abajo.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v7

      - name: Normalizar nombre de imagen (GHCR exige minusculas)
        run: echo "IMAGEN=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Calcular tags de la imagen (latest + sha; version semver en push de tag vX.Y.Z)
        run: |
          IMAGE_TAGS=("${IMAGEN}:latest" "${IMAGEN}:${{ github.sha }}")
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"
            MINOR="${VERSION%.*}"
            IMAGE_TAGS+=("${IMAGEN}:${VERSION}" "${IMAGEN}:${MINOR}")
          fi
          {
            echo "TAGS<<TAGS_EOF"
            printf '%s\n' "${IMAGE_TAGS[@]}"
            echo "TAGS_EOF"
          } >> "$GITHUB_ENV"

      - name: Construir imagen (sin publicar todavia)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.TAGS }}

      - name: Escanear vulnerabilidades con Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGEN }}:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

      - name: Iniciar sesion en GitHub Container Registry
        if: >
          github.event_name == 'push' &&
          (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar imagen (ya escaneada; reutiliza la cache de la construccion anterior)
        if: >
          github.event_name == 'push' &&
          (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.TAGS }}
