# ============================================================
# PostgresPulse - Despliegue de produccion con TLS (docs/DEPLOYMENT.md #4.6)
#
# Diferencias respecto a docker-compose.yml (entorno de demo, en la raiz):
#   - Sin target-demo: la BD de ventas mal modelada a proposito es solo
#     para el demo local de un comando (docs/SPECS.md #17); no pertenece
#     a un despliegue real.
#   - Sin valores por defecto inseguros: cada variable sensible es
#     obligatoria (${VAR:?...}) y el arranque falla si falta alguna, en
#     vez de advertir y continuar (AvisoDefaultsInseguros) como hace el
#     demo a proposito para no romper "docker compose up" sin configurar
#     nada.
#   - "app" ya no publica el puerto 8080 al host: solo "caddy" es
#     publico (80/443). Caddy termina TLS con un certificado Let's
#     Encrypt renovado automaticamente (ver Caddyfile.example).
#   - PULSE_BLOQUEAR_DEFAULTS_INSEGUROS=true: ademas de exigir cada
#     variable sensible arriba, falla el arranque si alguna igual quedo
#     con el valor de desarrollo (admin/admin, etc.) -- ver
#     AvisoDefaultsInseguros.
#   - PULSE_PROXIES_CONFIABLES fija a la subred interna (172.28.0.0/24,
#     ver "networks" abajo): "app" solo confia en X-Forwarded-For/
#     X-Real-IP cuando la conexion TCP viene de esa subred (donde vive
#     "caddy", el unico reverse proxy de este compose) -- de lo
#     contrario el rate limiting y el bloqueo por fuerza bruta verian
#     siempre la IP de Caddy en vez de la del cliente real.
#
# Uso:
#   cp deploy/Caddyfile.example deploy/Caddyfile
#   PULSE_DOMAIN=pulse.midominio.com \
#   PULSE_DB_PASSWORD=... PULSE_CRYPTO_KEY=... PULSE_JWT_SECRET=... \
#   PULSE_ADMIN_USER=... PULSE_ADMIN_PASSWORD=... \
#     docker compose -f deploy/docker-compose.prod.yml up -d --build
#
# Requiere DNS de PULSE_DOMAIN apuntando a este host y los puertos 80/443
# accesibles publicamente (Caddy los usa para el reto ACME y para servir
# HTTPS). "app" y "pulse-db" viven en la misma red interna y no exponen
# puertos al host.
#
# Stack de monitoreo opcional (Prometheus + Grafana, docs/DEPLOYMENT.md
# #5.6): igual que "app", ni "prometheus" ni "grafana" exponen puertos al
# host aqui -- el operador decide si los publica via Caddy (bloque de
# ejemplo comentado en Caddyfile.example) o los deja solo accesibles
# dentro de la red interna (p.ej. tunel SSH).
#   cp deploy/Caddyfile.example deploy/Caddyfile   # y descomenta el bloque de monitoreo si aplica
#   PULSE_DEMO_URL=https://pulse.midominio.com ./scripts/generar-token-monitoreo.sh
#   docker compose -f deploy/docker-compose.prod.yml --profile monitoring up -d
# ============================================================

services:
  pulse-db:
    image: postgres:16-alpine
    container_name: pulse-db
    environment:
      POSTGRES_DB: pulse_db
      POSTGRES_USER: pulse
      POSTGRES_PASSWORD: ${PULSE_DB_PASSWORD:?Definir PULSE_DB_PASSWORD}
    volumes:
      - pulse_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulse -d pulse_db"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: pulse-app
    environment:
      PULSE_LOG_FORMAT: ecs
      PULSE_DB_URL: jdbc:postgresql://pulse-db:5432/pulse_db
      PULSE_DB_USER: pulse
      PULSE_DB_PASSWORD: ${PULSE_DB_PASSWORD:?Definir PULSE_DB_PASSWORD}
      PULSE_CRYPTO_KEY: ${PULSE_CRYPTO_KEY:?Definir PULSE_CRYPTO_KEY (>=32 caracteres, gestor de secretos)}
      PULSE_SCHEDULER_ENABLED: ${PULSE_SCHEDULER_ENABLED:-false}
      PULSE_SCHEDULER_CRON: ${PULSE_SCHEDULER_CRON:-0 0 * * * *}
      PULSE_ADMIN_USER: ${PULSE_ADMIN_USER:?Definir PULSE_ADMIN_USER}
      PULSE_ADMIN_PASSWORD: ${PULSE_ADMIN_PASSWORD:?Definir PULSE_ADMIN_PASSWORD}
      PULSE_JWT_SECRET: ${PULSE_JWT_SECRET:?Definir PULSE_JWT_SECRET (>=16 caracteres, gestor de secretos)}
      PULSE_DEMO_SEED: "false"
      PULSE_BLOQUEAR_DEFAULTS_INSEGUROS: "true"
      PULSE_PROXIES_CONFIABLES: "172.28.0.0/24"
    expose:
      - "8080"
    depends_on:
      pulse-db:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: "1.0"

  caddy:
    image: caddy:2-alpine
    container_name: pulse-caddy
    depends_on:
      - app
    environment:
      PULSE_DOMAIN: ${PULSE_DOMAIN:?Definir PULSE_DOMAIN, ej. pulse.midominio.com}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

  # Stack de monitoreo opcional -- solo arranca con --profile monitoring,
  # ver comentario de cabecera. Sin "ports": igual que "app", solo
  # accesibles dentro de la red interna salvo que el operador los
  # publique via Caddy (Caddyfile.example).
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: pulse-prometheus
    profiles: ["monitoring"]
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../monitoring/prometheus_token.txt:/etc/prometheus/postgrespulse.token:ro
    expose:
      - "9090"
    depends_on:
      - app
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.4.2
    container_name: pulse-grafana
    profiles: ["monitoring"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:?Definir GF_SECURITY_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?Definir GF_SECURITY_ADMIN_PASSWORD}
    volumes:
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    expose:
      - "3000"
    depends_on:
      - prometheus
    restart: unless-stopped

networks:
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  pulse_data:
  caddy_data:
  caddy_config:
