spring:
  application:
    name: postgrespulse

  datasource:
    url: ${PULSE_DB_URL:jdbc:postgresql://localhost:5432/pulse_db}
    username: ${PULSE_DB_USER:pulse}
    password: ${PULSE_DB_PASSWORD:pulse}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 50

  flyway:
    enabled: true

  jackson:
    default-property-inclusion: non_null

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 5
        minimum-number-of-calls: 3
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 1

app:
  cifrado:
    clave: ${PULSE_CRYPTO_KEY:clave-de-desarrollo-por-defecto-32-caracteres!}
  programacion:
    cron: ${PULSE_SCHEDULER_CRON:0 0 * * * *}
    habilitado: ${PULSE_SCHEDULER_ENABLED:false}
