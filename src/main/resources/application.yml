spring:
  application:
    name: postgrespulse

  datasource:
    url: ${PULSE_DB_URL:jdbc:postgresql://localhost:5432/pulse_db}
    username: ${PULSE_DB_USER:pulse}
    password: ${PULSE_DB_PASSWORD:pulse}
    hikari:
      maximum-pool-size: ${PULSE_DB_POOL_MAX:10}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 50

  flyway:
    enabled: true

  mail:
    host: ${PULSE_SMTP_HOST:}
    port: ${PULSE_SMTP_PORT:587}
    username: ${PULSE_SMTP_USER:}
    password: ${PULSE_SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  jackson:
    default-property-inclusion: non_null

  lifecycle:
    # Le da tiempo a un analisis en curso (hasta 3 en paralelo, ver
    # OrquestadorAnalisisServicio) a terminar antes de que el proceso corte
    # las conexiones, en vez de dejarlo a mitad ante un redeploy/docker stop.
    timeout-per-shutdown-phase: ${PULSE_SHUTDOWN_TIMEOUT_SEGUNDOS:30}s

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
  health:
    mail:
      # El SMTP de alertas es opcional (PULSE_SMTP_HOST vacio por defecto);
      # sin esto, el HealthIndicator de correo intenta conectar y marca
      # /actuator/health como DOWN aunque la app este perfectamente sana.
      enabled: false
  info:
    build:
      enabled: true
    env:
      enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 5
        minimum-number-of-calls: 3
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 1
  retry:
    configs:
      default:
        max-attempts: 2
        wait-duration: 500ms
        retry-exceptions:
          - java.sql.SQLTransientException
          - java.sql.SQLTimeoutException
        ignore-exceptions:
          - io.github.resilience4j.circuitbreaker.CallNotPermittedException

app:
  cifrado:
    clave: ${PULSE_CRYPTO_KEY:clave-de-desarrollo-por-defecto-32-caracteres!}
  programacion:
    cron: ${PULSE_SCHEDULER_CRON:0 0 * * * *}
    habilitado: ${PULSE_SCHEDULER_ENABLED:false}
  seguridad:
    usuario: ${PULSE_ADMIN_USER:admin}
    contrasena: ${PULSE_ADMIN_PASSWORD:admin}
  jwt:
    secreto: ${PULSE_JWT_SECRET:secreto-jwt-de-desarrollo-por-defecto!}
    expiracion-minutos: ${PULSE_JWT_EXPIRACION_MINUTOS:480}
  demo:
    sembrar: ${PULSE_DEMO_SEED:false}
  limite-tasa:
    peticiones-por-minuto: ${PULSE_API_RATE_LIMIT:60}
  alertas:
    email-habilitado: ${PULSE_ALERTS_EMAIL_ENABLED:false}
    email-desde: ${PULSE_ALERTS_EMAIL_FROM:}
    email-para: ${PULSE_ALERTS_EMAIL_TO:}
    slack-webhook-url: ${PULSE_ALERTS_SLACK_WEBHOOK_URL:}
    pagerduty-routing-key: ${PULSE_ALERTS_PAGERDUTY_ROUTING_KEY:}
  heartbeat:
    url: ${PULSE_HEARTBEAT_URL:}
    intervalo-minutos: ${PULSE_HEARTBEAT_INTERVALO_MINUTOS:5}

logging:
  structured:
    format:
      # ECS estructurado (JSON) por consola, para agregadores de logs;
      # vacio = formato de consola legible por defecto de Spring Boot.
      # No se ata al perfil "docker": PULSE_LOG_FORMAT=ecs funciona igual
      # corriendo el jar suelto, en Kubernetes, etc. docker-compose.yml lo
      # activa por defecto (docs/DEPLOYMENT.md #4).
      console: ${PULSE_LOG_FORMAT:}
