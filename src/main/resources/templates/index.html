<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="es">
<head>
    <meta charset="UTF-8">
    <title>PostgresPulse — Resumen</title>
    <link rel="stylesheet" th:href="@{/panel.css}">
</head>
<body>
<div th:replace="~{fragmentos/nav :: barra}"></div>
<div class="contenido">
    <h1>Resumen</h1>
    <p class="meta">Puntuación de salud actual de cada fuente registrada. <span data-actualizado-hace></span></p>

    <div th:if="${error}" class="banner banner-error" th:text="${error}">Error</div>
    <div th:if="${exito}" class="banner banner-exito" th:text="${exito}">Éxito</div>

    <div th:if="${#lists.isEmpty(fuentes)}" class="vacio">
        Todavía no hay fuentes registradas. Registrá la primera con el formulario de abajo.
    </div>

    <div class="tarjetas" th:unless="${#lists.isEmpty(fuentes)}">
        <div class="tarjeta tarjeta-fuente" th:each="item : ${fuentes}" th:attr="data-fuente-id=${item.fuente.id}">
            <div class="nombre">
                <a th:href="@{/fuentes/{id}(id=${item.fuente.id})}" th:text="${item.fuente.nombre}">Fuente</a>
            </div>
            <div class="meta" th:text="${item.fuente.host} + ':' + ${item.fuente.puerto} + '/' + ${item.fuente.baseDeDatos}">host</div>
            <span class="badge js-estado-fuente" th:classappend="${item.fuente.estado}" th:text="${item.fuente.estado}">ESTADO</span>

            <div class="js-puntaje-slot">
                <div class="puntaje" th:if="${item.ultimoAnalisis != null and item.ultimoAnalisis.puntajeSalud != null}"
                     th:classappend="${item.ultimoAnalisis.estado}"
                     th:text="${item.ultimoAnalisis.puntajeSalud} + ' / 100'">— / 100</div>
                <div class="meta" th:unless="${item.ultimoAnalisis != null and item.ultimoAnalisis.puntajeSalud != null}">Sin análisis todavía</div>
            </div>

            <div class="acciones">
                <form th:action="@{/fuentes/{id}/analizar(id=${item.fuente.id})}" method="post">
                    <button type="submit" class="boton">Analizar ahora</button>
                </form>
                <a th:href="@{/fuentes/{id}(id=${item.fuente.id})}" class="boton boton-secundario">Ver detalle</a>
            </div>
        </div>
    </div>

    <h2>Registrar fuente</h2>
    <form class="formulario" th:action="@{/fuentes}" th:object="${formulario}" method="post">
        <div class="campo">
            <label for="nombre">Nombre</label>
            <input id="nombre" type="text" th:field="*{nombre}" required>
        </div>
        <div class="campo">
            <label for="host">Host</label>
            <input id="host" type="text" th:field="*{host}" required>
        </div>
        <div class="campo">
            <label for="puerto">Puerto</label>
            <input id="puerto" type="number" th:field="*{puerto}" min="1" max="65535" required>
        </div>
        <div class="campo">
            <label for="baseDeDatos">Base de datos</label>
            <input id="baseDeDatos" type="text" th:field="*{baseDeDatos}" required>
        </div>
        <div class="campo">
            <label for="usuario">Usuario</label>
            <input id="usuario" type="text" th:field="*{usuario}" required>
        </div>
        <div class="campo">
            <label for="contrasena">Contraseña</label>
            <input id="contrasena" type="password" th:field="*{contrasena}" required>
        </div>
        <div class="campo">
            <label for="filtroEsquema">Filtro de esquema</label>
            <input id="filtroEsquema" type="text" th:field="*{filtroEsquema}" placeholder="public,ventas">
        </div>
        <div class="campo">
            <label for="sslModo">Modo SSL</label>
            <select id="sslModo" th:field="*{sslModo}">
                <option th:each="modo : ${T(com.postgrespulse.dominio.SslModo).values()}"
                        th:value="${modo}" th:text="${modo}"></option>
            </select>
        </div>
        <div class="campo">
            <label for="umbralAlerta">Umbral de alerta</label>
            <input id="umbralAlerta" type="number" step="0.01" min="0" max="100"
                   th:field="*{umbralAlerta}" placeholder="Sin umbral = sin alertas">
        </div>
        <div class="campo">
            <button type="submit" class="boton">Registrar</button>
        </div>
    </form>
</div>

<script th:src="@{/panel.js}"></script>
<script>
    PostgresPulsePanel.iniciarPoll('/resumen-panel', (fuentes) => {
        fuentes.forEach((item) => {
            const tarjeta = document.querySelector('[data-fuente-id="' + item.fuente.id + '"]');
            if (!tarjeta) {
                return;
            }
            const badge = tarjeta.querySelector('.js-estado-fuente');
            badge.textContent = item.fuente.estado;
            badge.className = 'badge js-estado-fuente ' + item.fuente.estado;

            const slot = tarjeta.querySelector('.js-puntaje-slot');
            slot.innerHTML = '';
            const puntaje = item.ultimoAnalisis ? item.ultimoAnalisis.puntajeSalud : null;
            const nodo = document.createElement('div');
            if (puntaje != null) {
                nodo.className = 'puntaje ' + item.ultimoAnalisis.estado;
                nodo.textContent = puntaje + ' / 100';
            } else {
                nodo.className = 'meta';
                nodo.textContent = 'Sin análisis todavía';
            }
            slot.appendChild(nodo);
        });
    });
</script>
</body>
</html>
