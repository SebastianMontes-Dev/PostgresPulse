<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title th:text="'PostgresPulse — Historial de ' + ${fuente.nombre}">PostgresPulse</title>
    <th:block th:replace="~{fragmentos/tema :: script}"></th:block>
    <link rel="stylesheet" th:href="@{/panel.css}">
</head>
<body>
<div th:replace="~{fragmentos/nav :: barra}"></div>
<div class="contenido">
    <p class="meta"><a th:href="@{/fuentes/{id}(id=${fuente.id})}" th:text="'← ' + ${fuente.nombre}">← Fuente</a></p>
    <h1>Historial</h1>
    <p class="meta"><span data-actualizado-hace></span></p>

    <div class="grafico-caja">
        <canvas id="graficoTendencia" height="70"></canvas>
    </div>

    <div th:if="${#lists.isEmpty(pagina.content)}" class="vacio">
        Todavía no hay análisis registrados para esta fuente.
    </div>

    <table th:unless="${#lists.isEmpty(pagina.content)}">
        <thead>
        <tr><th>Fecha</th><th>Estado</th><th>Puntaje</th><th>Duración</th><th>Disparado por</th><th></th></tr>
        </thead>
        <tbody>
        <tr th:each="a : ${pagina.content}">
            <td th:text="${a.analizadoEn}">-</td>
            <td><span class="badge" th:classappend="${a.estado}"><th:block th:replace="~{fragmentos/estado :: etiqueta(${a.estado})}"></th:block></span></td>
            <td th:text="${a.puntajeSalud} ?: '—'">-</td>
            <td th:text="${a.duracionMs} ?: '—'">-</td>
            <td th:text="${a.disparadoPor}">-</td>
            <td><a th:href="@{/api/v1/analisis/{id}/exportar(id=${a.id},formato='html')}" target="_blank" rel="noopener">Reporte</a></td>
        </tr>
        </tbody>
    </table>

    <div class="paginacion" th:if="${pagina.totalPages > 1}">
        <a th:if="${pagina.page > 0}" th:href="@{/fuentes/{id}/historial(id=${fuente.id},page=${pagina.page - 1})}" class="boton boton-secundario">← Anterior</a>
        <span class="meta" th:text="'Página ' + (${pagina.page} + 1) + ' de ' + ${pagina.totalPages}">-</span>
        <a th:if="${pagina.page + 1 < pagina.totalPages}" th:href="@{/fuentes/{id}/historial(id=${fuente.id},page=${pagina.page + 1})}" class="boton boton-secundario">Siguiente →</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"
        integrity="sha384-vsrfeLOOY6KuIYKDlmVH5UiBmgIdB1oEf7p01YgWHuqmOHfZr374+odEv96n9tNC"
        crossorigin="anonymous"></script>
<script th:src="@{/panel.js}"></script>
<script>
    const coloresIniciales = PostgresPulsePanel.coloresGrafico();
    const grafico = new Chart(document.getElementById('graficoTendencia'), {
        type: 'line',
        data: {
            labels: [],
            datasets: [{
                label: 'Puntuación de salud (últimos 7)',
                data: [],
                borderColor: coloresIniciales.linea,
                backgroundColor: coloresIniciales.relleno,
                tension: 0.25,
                fill: true
            }]
        },
        options: {
            scales: {
                y: { min: 0, max: 100, ticks: { color: coloresIniciales.texto }, grid: { color: coloresIniciales.grilla } },
                x: { ticks: { color: coloresIniciales.texto }, grid: { color: coloresIniciales.grilla } }
            },
            plugins: { legend: { labels: { color: coloresIniciales.texto } } }
        }
    });

    PostgresPulsePanel.iniciarTema();
    document.addEventListener('pulse:tema-cambio', () => {
        const colores = PostgresPulsePanel.coloresGrafico();
        grafico.data.datasets[0].borderColor = colores.linea;
        grafico.data.datasets[0].backgroundColor = colores.relleno;
        grafico.options.scales.x.ticks.color = colores.texto;
        grafico.options.scales.x.grid.color = colores.grilla;
        grafico.options.scales.y.ticks.color = colores.texto;
        grafico.options.scales.y.grid.color = colores.grilla;
        grafico.options.plugins.legend.labels.color = colores.texto;
        grafico.update();
    });

    const urlSalud = window.location.pathname.replace(/\/historial$/, '') + '/salud-panel';
    PostgresPulsePanel.iniciarPoll(urlSalud, (salud) => {
        grafico.data.labels = salud.tendencia7d.map(d => d.analizadoEn);
        grafico.data.datasets[0].data = salud.tendencia7d.map(d => d.puntajeSalud);
        grafico.update();
    });
</script>
</body>
</html>
